# Throwaway Postgres for the integration tests. Separate project, port and
# container from a real morfeu install, and kept in memory: nothing survives.
name: morfeu-test
services:
  db:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:5434:5432"
    environment:
      POSTGRES_USER: morfeu
      POSTGRES_PASSWORD: morfeu
      POSTGRES_DB: morfeu_test
    tmpfs:
      - /var/lib/postgresql
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morfeu -d morfeu_test"]
      interval: 1s
      timeout: 3s
      retries: 60
