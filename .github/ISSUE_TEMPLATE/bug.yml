name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: morfeu doctor --json
      description: Paste the output. It contains no memory content, keys or passwords.
      render: json
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Error messages, logs (remove anything private first), your OS.
